    <div class="backdrop formClose" id="backdrop"></div>
    <form action="" class="form" id="form">
        <div class="card">
            <div class="card-header d-flex justify-content-between">
                <h5 class="m-0 text">Add Movie</h5>

                <h5 class="m-0"><i class="fa-solid fa-square-xmark formClose fa-2x"></i></h5>
            </div>

            <div class="card-body">
                <div class="form-group">
                    <label for="movieName">Movie Name<span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="movieName">
                </div>

                <div class="form-group">
                    <label for="movieImage">Movie Image<span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="movieImage">
                </div>

                <div class="form-group">
                    <label for="movieDescription">Movie Description<span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="movieDescription">
                </div>

                <div class="form-group">
                    <label for="movieRating">Movie Rating<span class="text-danger">*</span></label>
                    <select name="" class="form-control" id="movieRating">
                        <option value=""></option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>


                    </select>
                </div>
            </div>

            <div class="card-footer d-flex justify-content-between">
                <button type="submit" class="btn btn-sm pri-btn" id="addMovie">Add Movie</button>
                <button type="button" class="btn btn-sm sec-btn d-none" id="updateMovie">Update Movie</button>
                <button type="button" class="formClose sec-btn">Cancel</button>
            </div>
        </div>
    </form>
